# Early-Exit 配置（无数据阶段）
# 只有固定层退出可用于正式性能基准；阈值退出仅用于控制流 smoke test。

exit:
  candidate_layers: [2, 4, 6, 8, 10, 11]   # 固定层基准候选
  fallback_layer: 11                        # encoder layer 11 强制兜底
  strategy:
    name: fixed_layer                       # 无数据阶段唯一正式策略
    threshold_rule: max_probability         # 仅 smoke test
    threshold: null                         # 未校准
    margin_rule: logit_margin               # 仅 smoke test
  pooling: masked_mean                      # 退出头使用的 pooling（可配置）

# 执行追踪
tracking:
  count_layer_calls: true
  record_latency_ms: true

# Batch 策略
batching:
  v1_fixed_layer_batch: true                # 整 batch 同固定层退出
  v1_dynamic_bs1: true                      # batch size 1 动态退出
  v2_active_set: false                      # 第二版：active-set，待实现开关
